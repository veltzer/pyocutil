[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyocutil"
version = "0.0.2"
requires-python = ">=3.14"
authors = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
maintainers = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
description = "utilities for openshift"
readme = "README.md"
license = "MIT"
keywords=[
    "oc",
    "openshift",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pytconf",
    "pylogconf",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "sphinx",
]

[project.urls]
"Homepage" = "https://github.com/veltzer/pyocutil"
"Bug Tracker" = "https://github.com/veltzer/pyocutil/issues"
"Documentation" = "https://veltzer.github.io/pyocutil"
"Download" = "https://pypi.org/project/pyocutil/"
"Repository" = "https://github.com/veltzer/pyocutil"

[project.scripts]
pyocutil = "pyocutil.main:main"

[tool.pytest.ini_options]
# Every strictness check pytest has (strict_config, strict_markers,
# strict_xfail, strict_parametrization_ids), and every warning fails the
# test that raised it rather than scrolling past in the summary.
strict = true
filterwarnings = ["error"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyocutil"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pyocutil/",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "docs/",
    "config/",
    "*.md",
]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
python-version = "3.14"
search-path = [
    "src",
    ".",
]

[tool.pyrefly.errors]
implicit-any-attribute = "error"
implicit-any-empty-container = "error"
implicit-any-lambda = "error"
implicit-any-parameter = "error"
implicit-any-type-argument = "error"
instance-var-assign = "error"
method-assign = "error"
missing-override-decorator = "error"
no-any-return = "error"
possibly-uninitialized-attribute = "error"

[tool.hatch.envs.default]
installer = "uv"

[tool.uv.pip]
prerelease = "disallow"
